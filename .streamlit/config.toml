[server]
address = "127.0.0.1"
port = 8501
headless = true
# Polling also detects imported-module edits when OneDrive misses file events.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0f766e"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#17253b"
font = "sans serif"
